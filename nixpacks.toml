[phases.install]
cmds = ["NODE_ENV=development pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm run -C artifacts/fanta11 build && pnpm run -C artifacts/api-server build"]

[start]
cmd = "export NODE_ENV=production && pnpm --filter @workspace/scripts run migrate:locked-gameweek-scoring && node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"
