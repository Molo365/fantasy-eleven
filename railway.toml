[build]
builder = "nixpacks"
installCommand = "NODE_ENV=development pnpm install --no-frozen-lockfile"
buildCommand = "pnpm run -C artifacts/fanta11 build && pnpm run -C artifacts/api-server build"

[deploy]
startCommand = "export NODE_ENV=production && pnpm --filter @workspace/scripts run migrate:locked-gameweek-scoring && node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"

[variables]
NIXPACKS_NODE_VERSION = "20"
BASE_PATH = "/"
